# Contextual drag, Phase I Final: does a route model of drafts in context
# transfer to a new model?
#
# Implements "Phase I Evaluation Plan, Team Princeton-2" for one held-out
# target, GPT-OSS-20B. The card measures the target from scratch: it solves
# AIME/HMMT 2024-25 problems 16 times; problems with >= 4 right and >= 4 wrong
# answers are kept; for T = 0..4 correct drafts out of K = 4 it answers each
# problem again with its own drafts in context, in 8 distinct orders; a fresh
# 16-sample baseline is drawn under a different seed. Five already-
# characterized models (data/route_model/source_ladders, measured before
# submission with the same protocol) fix the route model's exponent gamma.
# The target's weights come from its baseline and its T = 0, 1 accuracies
# alone, and its T = 2, 3 accuracies are predicted and scored.
#
# Pre-registered (fixed before submission): model versions and sampling
# settings (src/contextual_drag/resources/inference/eval_models_params.json),
# prompts (prompt_templates/), the evaluation code, the source ladders, the
# fitting settings and seeds below, and the pass rule in the claim.
#
# On the study's existing GPT-OSS-20B measurements this exact procedure gives
# errors of -3.31 (T = 2) and -2.60 (T = 3) points, a pass.
#
# Serving. Every generation round goes wherever CONTEXTUAL_DRAG_ENDPOINT
# (or infer-stack's OPENAI_BASE_URL) points; unset, an in-process vLLM engine
# is built on one GPU. A served openai/gpt-oss-20b must have
# max_model_len >= 32768, the window the source ladders were generated with;
# the inference nodes check GET /v1/models and refuse a smaller window.
#
# Not pinned by the package, so stated here: the source ladders and the
# retrospective used openai/gpt-oss-20b at revision
# 6cee5e81ee83917806bbde320786a8fb61efebee (main as of 2026-10-09), and the
# gpt-oss chat template stamps the run date into every prompt; this run's
# prompts will carry its own date.

name: contextual_drag_ccg_transfer

title: "Contextual Drag — route-model transfer to GPT-OSS-20B (Phase I Final)"

description: |
  Asking a model to improve on earlier attempts in its context is a building
  block of recursive self-improvement, but the attempts do more than inform:
  correct drafts pull the model toward the right answer and wrong drafts toward
  their errors (contextual drag). This card tests a route model of that effect
  and whether its parameters transfer to a model measured only partially.

  The route model treats the final answer as a choice among routes -- adopt an
  answer already in context, or solve independently -- taken in proportion to
  their weights. With K drafts of which T are correct, wrong drafts in answer
  classes of sizes n_j, and no-draft accuracy q,
  F = (a T^gamma + q) / (a T^gamma + b sum_j n_j^gamma + 1).

  The target is GPT-OSS-20B, measured from scratch by this card. Five
  already-characterized models (GPT-OSS-120B, Gemma4-31B, Gemma4-E4B,
  Qwen3-32B, Qwen3-8B), measured before submission with the same protocol, are
  the sources: gamma and their weights are fit by maximum likelihood on their
  full measurements. The target contributes only its fresh baseline accuracy
  and its accuracy with zero and one correct draft; with gamma fixed, those
  set its weights, and the route model predicts its accuracy with two, three
  and four correct drafts. The claim is that the T = 2 and T = 3 predictions
  are both within 5 points of the measured accuracy. T = 4 is reported
  separately. Simultaneous 95% intervals come from a Bonferroni-adjusted
  bootstrap over problems that resamples problems jointly across the target
  and the sources and refits every stage; at about 22 eligible problems they
  are expected to be wider than the tolerance, so the verdict rests on the
  point estimates.

